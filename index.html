<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعمنا | Restaurant</title>
<style>
  :root{
    --bg:#151515;
    --bg2:#202020;
    --gold:#d4af37;
    --gold2:#f0d477;
    --white:#fff;
    --black:#080808;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Trebuchet MS","Arial",sans-serif;
    color:var(--white);
    background:
      radial-gradient(circle at 20% 10%,rgba(212,175,55,.10),transparent 28%),
      radial-gradient(circle at 80% 90%,rgba(212,175,55,.08),transparent 30%),
      var(--bg);
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
    background-image:linear-gradient(135deg,rgba(255,255,255,.025) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.025) 50%,rgba(255,255,255,.025) 75%,transparent 75%);
    background-size:28px 28px;
  }
  .gold-frame{position:fixed;inset:9px;border:1px solid rgba(212,175,55,.65);pointer-events:none;z-index:20;box-shadow:inset 0 0 35px rgba(212,175,55,.06),0 0 18px rgba(212,175,55,.12)}
  header{text-align:center;padding:85px 20px 45px}
  .logo{
    display:inline-block;margin:0 0 18px;padding:8px 20px;
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:clamp(42px,10vw,82px);letter-spacing:2px;
    color:var(--gold2);text-shadow:0 2px 0 #6e5612,0 0 18px rgba(212,175,55,.28);
  }
  .tagline{color:#ddd;font-size:18px;line-height:1.8;max-width:650px;margin:auto}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  button,.btn{
    border:1px solid rgba(212,175,55,.5);cursor:pointer;color:#fff;background:var(--black);
    padding:14px 25px;border-radius:10px;font-size:17px;
    box-shadow:0 8px 20px rgba(212,175,55,.24),0 0 10px rgba(212,175,55,.13);
    transition:.2s transform,.2s box-shadow,.2s border-color;
  }
  button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(212,175,55,.35),0 0 14px rgba(212,175,55,.2);border-color:var(--gold)}
  .section{width:min(1000px,92%);margin:30px auto 80px}
  .section-title{text-align:center;font-family:Georgia,serif;color:var(--gold2);font-size:34px;margin-bottom:30px}
  .category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
  .category-btn{width:100%;min-height:72px;font-family:Georgia,serif}
  .menu-panel{margin-top:28px;background:rgba(8,8,8,.72);border:1px solid rgba(212,175,55,.35);border-radius:16px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
  .menu-heading{text-align:center;color:var(--gold2);font-family:Georgia,serif;font-size:28px;margin:0 0 20px}
  .items{display:grid;gap:12px}
  .item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#111;border:1px solid #333;border-radius:12px;padding:15px;
    box-shadow:0 5px 14px rgba(212,175,55,.10);cursor:pointer;
  }
  .item:hover{border-color:rgba(212,175,55,.65)}
  .item-name{font-size:17px;line-height:1.5}
  .item-en{display:block;color:#aaa;font-size:13px;direction:ltr;text-align:right;margin-top:2px}
  .price{white-space:nowrap;color:var(--gold2);font-weight:bold}
  .cart{
    position:fixed;left:18px;bottom:18px;z-index:30;
    min-width:145px;font-weight:bold;
  }
  .cart-count{color:var(--gold2)}
  .cart-box{
    position:fixed;left:18px;bottom:78px;width:min(390px,calc(100vw - 36px));z-index:29;
    background:#101010;border:1px solid rgba(212,175,55,.6);border-radius:16px;padding:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.7),0 0 20px rgba(212,175,55,.12);
    display:none;
  }
  .cart-box.open{display:block}
  .cart-box h3{margin:0 0 12px;color:var(--gold2);font-family:Georgia,serif}
  .cart-list{max-height:280px;overflow:auto}
  .cart-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #292929}
  .cart-total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin:15px 0;color:var(--gold2)}
  .empty{text-align:center;color:#aaa;padding:20px}
  .note{text-align:center;color:#aaa;font-size:13px;margin-top:10px}
  footer{text-align:center;padding:30px;color:#888;border-top:1px solid rgba(212,175,55,.18)}
  @media(max-width:520px){header{padding-top:65px}.item{align-items:flex-start}.item-name{font-size:15px}.price{font-size:15px}}
</style>
</head>
<body>
<div class="gold-frame"></div>

<header id="home">
  <div class="logo">NOURÉ</div>
  <div class="tagline">أهلاً وسهلاً في مطعمنا ✨<br>طعم لبناني أصيل، ومحضّر بحب.</div>
  <div class="actions">
    <a class="btn" href="#menu">المنيو | Menu</a>
    <a class="btn" id="contactBtn" href="#" target="_blank" rel="noopener">تواصل معنا | Contact</a>
  </div>
</header>

<main class="section" id="menu">
  <h2 class="section-title">قائمة الطعام | Menu</h2>
  <div id="categories" class="category-grid"></div>
  <div id="menuPanel" class="menu-panel" hidden>
    <h3 id="menuHeading" class="menu-heading"></h3>
    <div id="items" class="items"></div>
  </div>
</main>

<div id="cartBox" class="cart-box">
  <h3>سلة الطلب</h3>
  <div id="cartList" class="cart-list"></div>
  <div class="cart-total"><span>المجموع</span><span id="cartTotal">0</span></div>
  <div class="note">السعر الظاهر لا يشمل خدمة الدليفري.</div>
  <button id="whatsappBtn" style="width:100%;margin-top:10px">إتمام الطلب عبر واتساب</button>
  <button id="clearBtn" style="width:100%;margin-top:10px">إفراغ السلة</button>
</div>

<button id="cartBtn" class="cart">السلة 🛒 <span class="cart-count">(0)</span></button>

<footer>© 2026 NOURÉ — جميع الحقوق محفوظة</footer>

<script>
/*
===========================================================
ملف تعديل المنيو — EDIT MENU
-----------------------------------------------------------
1) لتغيير اسم المطعم: غيّر RESTAURANT_NAME.
2) لتغيير رقم واتساب: غيّر WHATSAPP_NUMBER إلى الرقم الدولي
   بدون + أو مسافات، مثال: 96170123456
3) لإضافة قسم: أضف عنصراً داخل MENU_DATA.
4) لحذف قسم: احذف القسم المطلوب من MENU_DATA.
5) لإضافة صنف: أضفه داخل items بالشكل:
   { ar:"اسم الصنف", en:"الاسم بالإنجليزية/Arabizi", price:200 }
6) لحذف صنف: احذف سطره.
7) السعر هو الرقم الذي سيظهر ويُجمع في السلة.
===========================================================
*/

const RESTAURANT_NAME = "NOURÉ";
const WHATSAPP_NUMBER = "96176364631"; // <-- ضع رقم واتساب هنا

const MENU_DATA = [
  {
    ar: "مناقيش عادية",
    en: "Manakish 3adiye",
    items: [
      { ar:"جبنة", en:"Jibne", price:200 },
      { ar:"جبنة 3 أنواع", en:"Jibne 3 Anwe3", price:350 },
      { ar:"جبنة مع جونبون", en:"Jibne ma3 Jambon", price:350 },
      { ar:"جبنة مع حبش", en:"Jibne ma3 Habash", price:350 },
      { ar:"جبنة مع سجق", en:"Jibne ma3 Sjou2", price:350 },
      { ar:"جبنة مع ببروني", en:"Jibne ma3 Pepperoni", price:350 },
      { ar:"ڤيتا بندورة وبصل", en:"Veta Banadoura w Bassal", price:250 },
      { ar:"لحمة", en:"Lahme", price:200 },
      { ar:"لحمة مع جبنة", en:"Lahme ma3 Jibne", price:300 },
      { ar:"نصف لحمة و نصف جبنة", en:"Nos Lahme w Nos Jibne", price:200 },
      { ar:"كوكتيل (نصف زعتر + نصف جبنة)", en:"Cocktail (Nos Za3tar + Nos Jibne)", price:150 },
      { ar:"لبنة مع خضرة", en:"Labne ma3 Khodra", price:150 },
      { ar:"منقوشة خضرة (بندورة + بصل + فليفلة)", en:"Man2oushe Khodra", price:100 },
      { ar:"منقوشة خضرة مع جبنة", en:"Man2oushe Khodra ma3 Jibne", price:250 },
      { ar:"كشك", en:"Kishk", price:150 },
      { ar:"كشك + جبنة", en:"Kishk + Jibne", price:250 },
      { ar:"سبانخ", en:"Sbanekh", price:150 },
      { ar:"زعتر", en:"Za3tar", price:100 },
      { ar:"زعتر اكسترا (مع خضرة)", en:"Za3tar Extra (ma3 Khodra)", price:130 },
      { ar:"دو بليكس", en:"Double X", price:350 }
    ]
  }
];

let cart = [];

const $ = id => document.getElementById(id);

$("contactBtn").href = "https://wa.me/" + WHATSAPP_NUMBER;

function money(n){ return Number(n).toLocaleString("en-US"); }

function renderCategories(){
  const box = $("categories");
  box.innerHTML = "";
  MENU_DATA.forEach((cat, i) => {
    const b = document.createElement("button");
    b.className = "category-btn";
    b.innerHTML = `${cat.ar}<br><small style="color:#aaa">${cat.en}</small>`;
    b.onclick = () => showCategory(i);
    box.appendChild(b);
  });
}

function showCategory(index){
  const cat = MENU_DATA[index];
  $("menuPanel").hidden = false;
  $("menuHeading").textContent = `${cat.ar} | ${cat.en}`;
  const box = $("items");
  box.innerHTML = "";

  cat.items.forEach(item => {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div class="item-name">
        ${item.ar}
        <span class="item-en">${item.en}</span>
      </div>
      <div class="price">${money(item.price)}</div>
    `;
    row.onclick = () => addToCart(item);
    box.appendChild(row);
  });

  $("menuPanel").scrollIntoView({behavior:"smooth",block:"start"});
}

function addToCart(item){
  const found = cart.find(x => x.ar === item.ar);
  if(found) found.qty++;
  else cart.push({...item, qty:1});
  renderCart();
  $("cartBox").classList.add("open");
}

function renderCart(){
  const list = $("cartList");
  list.innerHTML = "";
  let total = 0, count = 0;

  if(!cart.length){
    list.innerHTML = '<div class="empty">السلة فارغة</div>';
  } else {
    cart.forEach((item, index) => {
      const subtotal = item.price * item.qty;
      total += subtotal;
      count += item.qty;

      const row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML = `
        <div>${item.ar} × ${item.qty}</div>
        <div>${money(subtotal)}</div>
      `;
      row.title = "اضغط لإزالة صنف واحد";
      row.onclick = () => {
        if(item.qty > 1) item.qty--;
        else cart.splice(index,1);
        renderCart();
      };
      list.appendChild(row);
    });
  }

  $("cartTotal").textContent = money(total);
  $("cartBtn").querySelector(".cart-count").textContent = `(${count})`;
}

function whatsappMessage(){
  if(!cart.length){
    alert("السلة فارغة. أضف طلباً أولاً.");
    return;
  }

  let total = 0;
  let lines = ["مرحباً، أريد طلب:" , ""];

  cart.forEach(item => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    lines.push(`${item.ar} × ${item.qty} — ${money(subtotal)}`);
  });

  lines.push("");
  lines.push(`المجموع: ${money(total)}`);
  lines.push("السعر لا يشمل خدمة الدليفري.");

  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(lines.join("\n"));
  window.open(url, "_blank");
}

$("cartBtn").onclick = () => $("cartBox").classList.toggle("open");
$("whatsappBtn").onclick = whatsappMessage;
$("clearBtn").onclick = () => { cart=[]; renderCart(); };

document.querySelector(".logo").textContent = RESTAURANT_NAME;
renderCategories();
renderCart();
</script>
</body>
</html>
