<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Welcome</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
:root{
 --pink:#ff477e;--pink2:#ff7597;--bg1:#090d1a;--bg2:#24064e;--bg3:#50051f;
 --glass:rgba(255,255,255,.075);--border:rgba(255,255,255,.16);--muted:#dbe2ed;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#090d1a;color:#fff}
body{min-height:100vh;overflow-x:hidden;background:linear-gradient(135deg,var(--bg1),var(--bg2) 52%,var(--bg3));}
button,input{font:inherit}
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrapper{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(440px,100%);padding:28px 22px;border:1px solid var(--border);border-radius:30px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 25px 80px rgba(0,0,0,.42),0 0 40px rgba(255,71,126,.12);animation:enter .7s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.lock-icon{font-size:48px;margin-bottom:10px;filter:drop-shadow(0 0 14px rgba(255,71,126,.5))}
h1{font-size:25px;font-weight:800;margin-bottom:9px}
p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:16px}
.input{width:88%;padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:#fff;outline:0;text-align:center;margin:5px auto 13px;display:block}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,71,126,.12)}
.btn{border:0;border-radius:17px;padding:14px 22px;background:var(--pink);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 25px rgba(255,71,126,.25);transition:.22s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}
.btn.secondary{background:rgba(255,255,255,.10);border:1px solid var(--border);box-shadow:none}
.btn.big{width:100%;font-size:18px;padding:16px}
.error{color:#ff8080;font-weight:700;font-size:14px;display:none;margin-top:8px}
.shake{animation:shake .4s}@keyframes shake{20%,80%{transform:translateX(3px)}40%,60%{transform:translateX(-5px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.badge{font-size:12px;color:var(--pink2);font-weight:800}
.progress{height:9px;border-radius:20px;background:rgba(255,255,255,.09);overflow:hidden;border:1px solid rgba(255,255,255,.1);margin-bottom:7px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pink2));border-radius:20px;transition:width .5s}
.timer{font-size:12px;color:#cbd5e1;margin-bottom:18px}
.gif{width:130px;height:130px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 18px;border:2px solid rgba(255,255,255,.24);box-shadow:0 12px 30px rgba(255,71,126,.24)}
.title{color:var(--pink2);font-size:21px;font-weight:800;margin-bottom:14px;line-height:1.65}
.title .line{display:block;min-height:29px}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.choices .btn{flex:1 1 150px}
.result-title{color:var(--pink2);font-size:26px;font-weight:800;margin-bottom:8px}
.message{padding:16px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);margin:14px 0}
.message strong{display:block;color:var(--pink2);margin-bottom:7px}
.scratch{height:135px;position:relative;border:1px dashed var(--pink2);border-radius:18px;overflow:hidden;margin:12px 0 18px}
.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px;text-align:center}
.reveal strong{color:var(--pink2);font-size:18px}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.actions{padding:16px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);margin-top:12px}
.actions p{font-size:14px;margin-bottom:10px}
.link{display:block;text-decoration:none;color:#fff;text-align:center;padding:14px;border-radius:15px;font-weight:800;margin:8px 0}
.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}.wa{background:#25d366}.song{background:linear-gradient(90deg,#ff0055,#ff5500)}
.youtube-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin-top:10px;border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.youtube-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.small{font-size:12px;color:rgba(255,255,255,.58);margin-top:15px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99999;background:rgba(10,10,20,.8);border:1px solid var(--border);backdrop-filter:blur(15px);padding:10px 16px;border-radius:999px;font-size:13px;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.tap{position:fixed;z-index:9999;pointer-events:none;font-size:24px;animation:tap .8s forwards}
@keyframes tap{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-120px) scale(1.35)}}
.conf{position:fixed;z-index:9998;pointer-events:none;animation:conf 2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s)) rotate(var(--r))}}
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<div id="toast"></div>
<div class="wrapper">
  <section class="card" id="lock">
    <div class="lock-icon">🔐</div>
    <h1 id="lockTitle">صفحة خاصة جداً</h1>
    <p id="lockText">أدخلي كلمة المرور للمتابعة 💗</p>
    <input id="pass" class="input" type="password" autocomplete="off" placeholder="كلمة المرور">
    <button class="btn big" id="enter">دخول 💖</button>
    <div class="error" id="err">❌ كلمة المرور غير صحيحة</div>
  </section>

  <main class="card hidden" id="app">
    <div class="top">
      <span class="badge" id="stepBadge"></span>
      <span class="badge" id="percent">0%</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="timer hidden" id="timer"></div>

    <div id="pages"></div>
  </main>
</div>
<script src="config.js"></script>
<script>
'use strict';
const C=window.LOVE_CONFIG||{};
const $=id=>document.getElementById(id);
const pages=$('pages'); let current=0,timer=null,typeTimer=null;
const fallbackGif='https://i.imgur.com/c4tA59P.gif';

function safeText(v){return String(v??'')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function play(freq=600,d=.1,type='sine'){try{const A=window.AudioContext||window.webkitAudioContext,ctx=new A();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}

function makePages(){
  const qs=Array.isArray(C.questions)?C.questions:[];
  pages.innerHTML='';
  qs.forEach((q,i)=>{
    const p=document.createElement('section');p.className='page hidden';p.id='p'+i;
    p.innerHTML=`<img class="gif" src="${safeText(q.image||fallbackGif)}" alt="">
      <div class="title">${safeText(q.lines||q.question||'')}</div>
      <div class="choices"></div>`;
    const choices=p.querySelector('.choices');
    (q.answers||[]).forEach((a,j)=>{
      const b=document.createElement('button');b.className='btn '+(j===1?'secondary':'');b.textContent=safeText(a.text||a);
      b.disabled=true;b.onclick=()=>answer(i,a);choices.appendChild(b);
    });
    pages.appendChild(p);
  });
  const result=document.createElement('section');result.className='page hidden';result.id='result';
  result.innerHTML=`<img class="gif" id="resultImg" alt=""><div class="result-title" id="resultTitle"></div><p id="resultIntro"></p>
  <div class="message"><strong id="messageLabel"></strong><div id="secret"></div></div>
  <p id="scratchHint"></p><div class="scratch"><div class="reveal"><strong id="scratchMsg"></strong><p id="scratchSub" style="margin:5px 0 0;font-size:12px"></p></div><canvas id="scratch"></canvas></div>
  <div class="actions" id="socialBox"><p id="socialTitle"></p><a id="ig" class="link ig" target="_blank"></a><a id="wa" class="link wa" target="_blank"></a></div>
  <div class="actions" id="songBox"><p id="songTitle"></p><div class="youtube-wrap"><iframe id="youtubePlayer" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>
  <div class="small" id="credit"></div>`;
  pages.appendChild(result);
  const sad=document.createElement('section');sad.className='page hidden';sad.id='sad';
  sad.innerHTML=`<img class="gif" id="sadImg" alt=""><div class="title" id="sadTitle"></div><p id="sadText"></p><p id="sadSub" style="color:var(--pink2)"></p><button class="btn big" id="retry"></button>`;
  pages.appendChild(sad);
}
function showPage(n){
  clearInterval(timer);clearTimeout(typeTimer);
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  const p=document.getElementById(n==='result'?'result':n==='sad'?'sad':'p'+n);if(!p)return;
  p.classList.remove('hidden');current=n;
  const total=(C.questions||[]).length||1;
  if(typeof n==='number'){
    const pct=Math.round((n/total)*100);$('bar').style.width=pct+'%';$('percent').textContent=pct+'%';$('stepBadge').textContent=`السؤال ${n+1} من ${total}`;
    typeLines(p);
    startTimer(p);
  }else{$('bar').style.width='100%';$('percent').textContent='100%';$('stepBadge').textContent='🎉 النهاية';$('timer').classList.add('hidden')}
}
function typeLines(el){
  const title=el.querySelector('.title');if(!title)return;
  const text=title.textContent.trim();title.textContent='';
  let i=0;function go(){if(i<text.length){title.textContent+=text[i++];typeTimer=setTimeout(go, C.typingSpeed||35)}}go();
}
function startTimer(p){
  const seconds=Math.max(0,Number(C.waitSeconds??3));const bs=p.querySelectorAll('button');bs.forEach(b=>b.disabled=true);
  if(!seconds){bs.forEach(b=>b.disabled=false);return}
  $('timer').classList.remove('hidden');let left=seconds;$('timer').textContent=`⏳ انتظري ${left} ثوانٍ...`;
  timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);$('timer').textContent='✨ يمكنك الإجابة الآن!';bs.forEach(b=>b.disabled=false)}else $('timer').textContent=`⏳ انتظري ${left} ثوانٍ...`},1000);
}
function answer(i,a){
  play(650,.1); if(a.next==='sad'||a.go==='sad'){showSad();return}
  const next=(a.next??i+1);
  if(next>=C.questions.length){showResult()}else showPage(Number(next));
}
function showSad(){
  clearInterval(timer);$('timer').classList.add('hidden');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  $('sad').classList.remove('hidden');$('stepBadge').textContent='💔';$('percent').textContent='0%';$('bar').style.width='0%';
  $('sadImg').src=C.sad?.image||fallbackGif;$('sadTitle').textContent=C.sad?.title||'آه... 😢';$('sadText').textContent=C.sad?.text||'';$('sadSub').textContent=C.sad?.sub||'';$('retry').textContent=C.sad?.retry||'🔄 المحاولة مجدداً';$('retry').onclick=()=>showPage(0);
}
function youtubeEmbedUrl(url){
  const u=String(url||'').trim();if(!u)return'';
  try{
    const x=new URL(u);
    if(x.hostname==='youtu.be'||x.hostname.endsWith('.youtu.be')){
      const id=x.pathname.split('/').filter(Boolean)[0];return id ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0` : '';
    }
    if(x.hostname.includes('youtube.com')){
      if(x.pathname.startsWith('/embed/')) return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(x.pathname.split('/')[2]||'')}?rel=0`;
      if(x.pathname.startsWith('/shorts/')) return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(x.pathname.split('/')[2]||'')}?rel=0`;
      const id=x.searchParams.get('v');if(id)return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0`;
    }
  }catch{}
  return'';
}
function showResult(){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$('result').classList.remove('hidden');$('timer').classList.add('hidden');
  const R=C.result||{};$('resultImg').src=R.image||fallbackGif;$('resultTitle').textContent=R.title||'🎉 مبروك الصلح 🎉';$('resultIntro').textContent=R.intro||'';$('messageLabel').textContent=R.messageLabel||'رسالة خاصة ❤️';
  $('secret').textContent=R.message||'';$('scratchHint').textContent=R.scratchHint||'حكّي الكرت بإصبعك لكشف السر 👇';$('scratchMsg').textContent=(R.scratchMessages||['أنتِ أجمل خطوة في حياتي'])[Math.floor(Math.random()*(R.scratchMessages||['💗']).length)];$('scratchSub').textContent=R.scratchSub||'أحبك دائماً وأبداً ♾️';
  $('socialTitle').textContent=R.socialTitle||'';$('ig').textContent=R.instagram?.label||'إرسال عبر إنستغرام 📸';$('ig').href=R.instagram?.url||'#';$('wa').textContent=R.whatsapp?.label||'إرسال عبر واتساب 💚';$('wa').href=R.whatsapp?.url||'#';
  $('songTitle').textContent=R.song?.title||'';
  const yt=youtubeEmbedUrl(R.song?.url);$('youtubePlayer').src=yt||'about:blank';$('songBox').style.display=yt?'block':'none';
  $('credit').textContent=R.credit||'تم التصميم بحب ❤️';
  $('socialBox').style.display=(R.instagram?.url||R.whatsapp?.url)?'block':'none';
  triggerExplosion();setTimeout(initScratch,100);
}
function initScratch(){
  const c=$('scratch');if(!c)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);
  x.fillStyle='#ff7597';x.fillRect(0,0,r.width,r.height);x.fillStyle='#fff';x.font='800 17px Tajawal';x.textAlign='center';x.fillText('حكّي هنا بإصبعك 👈',r.width/2,r.height/2+6);
  let down=false;const pos=e=>{const t=e.touches?.[0]||e,rr=c.getBoundingClientRect();return [t.clientX-rr.left,t.clientY-rr.top]};
  const scratch=e=>{if(!down)return;e.preventDefault?.();const [px,py]=pos(e);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(px,py,24,0,Math.PI*2);x.fill()};
  c.onpointerdown=e=>{down=true;scratch(e)};c.onpointermove=scratch;window.addEventListener('pointerup',()=>down=false,{once:false});
}
function triggerExplosion(){const chars=['💖','🌹','✨','💕','♥','🌸','💗'];for(let i=0;i<36;i++){const e=document.createElement('div');e.className='conf';e.textContent=chars[i%chars.length];e.style.left=innerWidth/2+'px';e.style.top=innerHeight/2+'px';e.style.setProperty('--x',(Math.cos(Math.random()*Math.PI*2)*(100+Math.random()*300))+'px');e.style.setProperty('--y',(Math.sin(Math.random()*Math.PI*2)*(80+Math.random()*280))+'px');e.style.setProperty('--s',1+Math.random());e.style.setProperty('--r',(Math.random()*720-360)+'deg');e.style.fontSize=20+Math.random()*16+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2100)}}
function ambient(){
 const c=$('ambient'),x=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();addEventListener('resize',resize);
 const hs=Array.from({length:18},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:10+Math.random()*9,v:.25+Math.random()*.8,o:.15+Math.random()*.35}));
 function loop(){x.clearRect(0,0,innerWidth,innerHeight);hs.forEach(h=>{h.y+=h.v;if(h.y>innerHeight+20){h.y=-20;h.x=Math.random()*innerWidth}x.globalAlpha=h.o;x.font=h.s+'px sans-serif';x.fillText('❤',h.x,h.y)});requestAnimationFrame(loop)}loop();
}
document.addEventListener('pointerdown',e=>{const t=document.createElement('div');t.className='tap';t.textContent=(C.tapEmoji||'💋');t.style.left=e.clientX+'px';t.style.top=e.clientY+'px';document.body.appendChild(t);setTimeout(()=>t.remove(),800)});
$('enter').onclick=()=>{if($('pass').value.trim()===String(C.password??'')){play(520,.15);$('lock').classList.add('hidden');$('app').classList.remove('hidden');showPage(0)}else{$('err').style.display='block';$('lock').classList.remove('shake');void $('lock').offsetWidth;$('lock').classList.add('shake');$('pass').value='';play(150,.2,'sawtooth')}};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
makePages();ambient();
</script>
</body>
</html>
