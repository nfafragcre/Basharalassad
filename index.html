<title>&#10084;</title>
<style>
  :root{
    --pink:#ff477e;
    --dark:#0f172a;
    --purple:#2a085c;
    --glass:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.18);
    --text:#fdf2f8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--dark)}
  body{
    font-family:"Segoe UI",Tahoma,system-ui,sans-serif;
    color:var(--text);
    min-height:100dvh;
    overflow-x:hidden;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(255,71,126,.28), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(42,8,92,.75), transparent 60%),
      linear-gradient(160deg,#0f172a 0%,#1b0b3a 55%,#2a085c 100%);
    -webkit-user-select:none;user-select:none;
  }
  /* خلفية القلوب المتحركة */
  #hearts-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .fheart{position:absolute;bottom:-40px;color:rgba(255,71,126,.55);font-size:22px;
    animation:floatUp linear infinite;filter:drop-shadow(0 0 6px rgba(255,71,126,.5))}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:1}
    90%{opacity:.9}
    100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
  }
  .wrap{position:relative;z-index:2;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .glass{
    width:min(460px,100%);
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:28px 22px 30px;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.15);
    text-align:center;
    animation:pop .5s cubic-bezier(.2,.8,.2,1.2);
  }
  @keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .bear{width:150px;height:150px;object-fit:contain;margin:2px auto 10px;display:block;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
  h1,h2{font-weight:800;line-height:1.5;text-wrap:balance}
  h1{font-size:1.5rem;margin-bottom:6px}
  h2{font-size:1.35rem;margin:6px 0 4px}
  p.sub{opacity:.85;font-size:.95rem;line-height:1.6;margin-bottom:16px}
  .field{position:relative;margin:14px 0 10px}
  input[type=password]{
    width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--glass-border);
    background:rgba(255,255,255,.1);color:var(--text);font-size:1.05rem;text-align:center;outline:none;
    transition:.2s;
  }
  input[type=password]:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,71,126,.25)}
  .btn{
    appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:800;
    padding:13px 22px;border-radius:16px;font-size:1.02rem;color:#fff;
    background:linear-gradient(135deg,var(--pink),#ff7aa2);
    box-shadow:0 10px 24px rgba(255,71,126,.4);
    transition:transform .15s, box-shadow .15s, opacity .2s;
    touch-action:manipulation;
  }
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.3)}
  .btn.ghost{background:rgba(255,255,255,.12);box-shadow:none;border:1px solid var(--glass-border)}
  .btn.wide{width:100%;margin-top:8px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .err{color:#ffd0dd;min-height:20px;font-size:.9rem;margin-top:8px;font-weight:600}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  /* شريط التقدم */
  .progress{height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:4px}
  .progress > i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--pink),#ffb3c9);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .pcount{font-size:.8rem;opacity:.75;margin-bottom:12px}
  .timer{font-size:.85rem;opacity:.8;margin-top:10px;min-height:18px}
  .hidden{display:none!important}
  /* صفحة القبول */
  .secret-box{
    margin:14px 0;padding:16px;border-radius:18px;border:1px dashed rgba(255,255,255,.3);
    background:rgba(255,71,126,.12);font-size:1.05rem;line-height:1.9;font-weight:700
  }
  /* كرت الحك */
  .scratch-wrap{position:relative;width:100%;max-width:340px;height:130px;margin:14px auto;border-radius:16px;overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--glass-border)}
  .scratch-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:14px;font-weight:800;font-size:1.05rem;
    background:linear-gradient(135deg,rgba(255,71,126,.25),rgba(42,8,92,.4));color:#fff}
  #scratch-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  .hint{font-size:.8rem;opacity:.7;margin-top:-4px}
  .contacts{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .ic{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;font-size:.95rem}
  .ic svg{width:20px;height:20px}
  .ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}
  .wa{background:#25d366;color:#08351b}
  .song{margin-top:12px;display:inline-flex;align-items:center;gap:8px;color:#ffd0dd;font-weight:700;text-decoration:none;font-size:.95rem;background:none;border:0;cursor:pointer;font-family:inherit}
  .song svg{width:18px;height:18px}
  .player{margin-top:14px;width:100%;max-width:420px;margin-inline:auto;aspect-ratio:16/9;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15)}
  .player iframe{width:100%;height:100%;border:0;display:block}
  /* انفجار الجسيمات */
  #burst{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
  .particle{position:absolute;font-size:26px;will-change:transform,opacity;animation:burst 1.8s ease-out forwards}
  @keyframes burst{
    0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}
  }
  .no-explode{animation:noExplode .55s cubic-bezier(.3,.7,.3,1) forwards;pointer-events:none}
  @keyframes noExplode{
    0%{transform:scale(1);opacity:1;filter:none}
    45%{transform:scale(1.9) rotate(6deg);opacity:1;filter:drop-shadow(0 0 16px rgba(255,71,126,.9))}
    70%{transform:scale(2.1) rotate(-4deg);opacity:.85}
    100%{transform:scale(.2) rotate(0);opacity:0;filter:blur(4px)}
  }
  .footnote{margin-top:16px;font-size:.72rem;opacity:.55}
  @media (max-width:380px){.bear{width:120px;height:120px}h1{font-size:1.3rem}}
</style>

<script>
/* ==== الحماية: منع النقر الأيمن وأدوات المطور ==== */
(function guard(){
  const kill = e => { e.preventDefault(); buzz(); return false; };
  document.addEventListener("contextmenu", kill);
  document.addEventListener("dragstart", e => e.preventDefault());
  document.addEventListener("selectstart", e => e.preventDefault());
  document.addEventListener("copy", e => e.preventDefault());
  document.addEventListener("keydown", function(e){
    const k = (e.key||"").toLowerCase();
    if(e.key === "F12") return kill(e);
    if(e.ctrlKey && e.shiftKey && ["i","j","c"].includes(k)) return kill(e);
    if(e.ctrlKey && ["u","s","p"].includes(k)) return kill(e);
    if(e.metaKey && e.altKey && ["i","j","c"].includes(k)) return kill(e);
  });
})();

/* ==== مؤثر صوتي + اهتزاز ==== */
let audioCtx;
function beep(freq, dur){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function buzz(){ if(navigator.vibrate) navigator.vibrate([60,40,60]); beep(180,.18); }
function chime(){ beep(660,.12); setTimeout(()=>beep(880,.16),120); }

let SECRET_DATA = null; // يُملأ ديناميكياً بعد التحقق

function b64ToBytes(b64){
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
async function sha256Hex(str){
  const data = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function decryptSecret(password){
  const keyBytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
  const key = await crypto.subtle.importKey("raw", keyBytes, {name:"AES-GCM"}, false, ["decrypt"]);
  const all = b64ToBytes(ENC_BLOB);
  const iv = all.slice(0,12);
  const ct = all.slice(12);
  const ptBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(ptBuf));
}

/* ==== شاشة القفل ==== */
const lockEl = document.getElementById("lock");

async function tryUnlock(){
  const val = passEl.value.trim();
  if(!val){ shakeLock("اكتبي كلمة السر أول &#128522;".replace(/&#128522;/,"\uD83D\uDE0A")); return; }
  const h = await sha256Hex(val);
  if(h !== PASSWORD_HASH){
    shakeLock("مو صحيحة... حاولي مرة ثانية \uD83D\uDD90\uFE0F");
    passEl.value="";
    return;
  }
  try{
    SECRET_DATA = await decryptSecret(val); // فك التشفير وحقن المحتوى الحساس ديناميكياً
  }catch(e){
    shakeLock("صار خطأ بفك التشفير"); return;
  }
  chime();
  lockEl.classList.add("hidden");
  startQuiz();
}
function shakeLock(msg){
  lockErr.innerHTML = msg;
  lockEl.classList.remove("shake"); void lockEl.offsetWidth; lockEl.classList.add("shake");
  buzz();
}
document.getElementById("unlock").addEventListener("click", tryUnlock);
passEl.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.nativeEvent?.isComposing && e.keyCode!==229) tryUnlock();
});

  {img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjUkHTqVA8TxKPDA20lMfkkav9zzrOs-YxBh9V4U63iWrExL-wJcBTYc2N_GJmtrycxIBXqWW6v0r8isAlkkv_o0nGBV-kRCXK3CT2Q9eUpAQI6r3yYjjFxrs2zzQ2yalZ78h3BwbVq0HVfPIP87_diObm0FMxKvf8DOs9ucbIgSR2T_dtPPqbTDG1ouLc/s1600/403.gif",
    title:"هل تقبلين أن تكوني لي إلى الأبد؟", sub:"فكري زين قبل لا تجاوبين \uD83D\uDC9E"},
  {img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhk24EUuDSPNMtl30gTDG8_c-QWbR7W7WsCN93VpUuB0W8Gv1oO_OjUBIlwuJvEjj5LvCVFwLDddPDz9HGJeVVYpS4j8x7zuT3OMaOTtXKq7h4HXMtXy5PTDu21YBgzbuoiJPmZkTT09JFo_YVLfWVQt8EPFXQGGWtt-SCytK7UdEuUgIgQegpcmppa4FU/s1600/404.gif",
    title:"تسمحين لي أكون سبب ابتسامتك كل يوم؟", sub:"جاوبيني من قلبك \uD83E\uDD70"},

    title:"تعديني نبقى مع بعض مهما صار؟", sub:"وعد صغير بس معناه كبير \uD83E\uDD1E"},
  {img:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg6lfqInD-FNhYGjMUrAxET1_opXFZduaSDra1yNiJK7_f8EHbvJhIBKc38MLcu2f9TBYuomGy0iIO2wMWKp8ald70V8UyXnhd8kT7iyhunvWgATe0_Adsrsoc_1vh5C-aEHJwXpjKcLGxfB57T0N_8xehZIhIqaEHmmB5tGdZ3yxmVieODALwmrrnqDFk/s1600/406.gif",
    title:"تحبيني مثل ما أنا أحبك؟", sub:"آخر سؤال... وأهمّه \uD83D\uDC98"}
];
let qi = 0, noMoves = 0;

const quizEl = document.getElementById("quiz");
const bar = document.getElementById("bar");
const pcount = document.getElementById("pcount");
const qBear = document.getElementById("q-bear");
const qTitle = document.getElementById("q-title");
const qSub = document.getElementById("q-sub");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const timerEl = document.getElementById("timer");

function startQuiz(){ qi=0; quizEl.classList.remove("hidden"); renderQuestion(); }

function renderQuestion(){
  const q = QUESTIONS[qi];
  noMoves = 0;
  qBear.src = q.img;
  qTitle.textContent = q.title;
  qSub.textContent = q.sub;
  pcount.textContent = "السؤال "+(qi+1)+" من "+QUESTIONS.length;
  bar.style.width = ((qi+1)/QUESTIONS.length*100)+"%";
  // إعادة زر "لا" لمكانه الطبيعي
  noBtn.style.position=""; noBtn.style.left=""; noBtn.style.top="";
  lockButtons();
}

/* المؤقت: 3 ثوانٍ قبل تمكين الأزرار */
function lockButtons(){
  yesBtn.disabled = true; noBtn.disabled = true;
  let t = 3;
  timerEl.textContent = "الأزرار تنفتح بعد "+t+" ثوانٍ...";
  const iv = setInterval(()=>{
    t--;
    if(t>0){ timerEl.textContent = "الأزرار تنفتح بعد "+t+" ثوانٍ..."; }
    else{
      clearInterval(iv);
      timerEl.textContent = "";
      yesBtn.disabled = false; noBtn.disabled = false;
    }
  },1000);
}

yesBtn.addEventListener("click", ()=>{
  if(yesBtn.disabled) return;
  chime();
  qi++;
  if(qi < QUESTIONS.length){ renderQuestion(); }
  else{ quizEl.classList.add("hidden"); showFinal(); }
});

/* زر "لا" يهرب 5 مرات ثم يذهب لصفحة الرفض */
function runAway(){
  if(noBtn.disabled) return;
  buzz();
  noMoves++;
  if(noMoves >= 5){
    explodeNo();
    return;
  }
  const pad = 12;
  const w = window.innerWidth, h = window.innerHeight;
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
  const x = pad + Math.random()*(w - bw - pad*2);
  const y = pad + Math.random()*(h - bh - pad*2);
  noBtn.style.position = "fixed";
  noBtn.style.left = x+"px";
  noBtn.style.top = y+"px";
}
noBtn.addEventListener("mouseenter", runAway);
noBtn.addEventListener("click", runAway);
noBtn.addEventListener("touchstart", e=>{ e.preventDefault(); runAway(); }, {passive:false});

/* الضغطة الخامسة: يكبر زر "لا" ثم ينفجر إلى قلوب وورود ويختفي، ويبقى "نعم" فقط */
function explodeNo(){
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  noBtn.classList.add("no-explode");
  chime();
  if(navigator.vibrate) navigator.vibrate([30,30,60]);
  setTimeout(()=>burst(cx, cy, 30), 300);
  setTimeout(()=>{
    noBtn.remove();
    yesBtn.classList.add("btn","wide");
    timerEl.textContent = "";
  }, 560);
}

document.getElementById("retry").addEventListener("click", ()=>{
  document.getElementById("reject").classList.add("hidden");
  qi = 0;
  quizEl.classList.remove("hidden");
  renderQuestion();
});

/* ==== الصفحة النهائية ==== */
function showFinal(){
  const f = document.getElementById("final");
  f.classList.remove("hidden");
  // حقن المحتوى الحساس بعد التحقق
  document.getElementById("secret").textContent = SECRET_DATA.secret;
  document.getElementById("ig").href = LINKS.instagram;
  document.getElementById("wa").href = LINKS.whatsapp;
  setupPlayer();
  setupScratch();
  burst();
  chime();
}

/* مشغّل الأغنية المضمّن داخل الصفحة */
function setupPlayer(){
  const btn = document.getElementById("song");
  const box = document.getElementById("player");
  btn.addEventListener("click", function(){
    const open = box.hasAttribute("hidden");
    if(open){
      if(!box.dataset.loaded){
        const f = document.createElement("iframe");
        f.src = "https://www.youtube-nocookie.com/embed/" + LINKS.songId + "?autoplay=1&rel=0";
        f.title = "أغنيتنا";
        f.allow = "autoplay; encrypted-media";
        f.setAttribute("allowfullscreen","");
        box.appendChild(f);
        box.dataset.loaded = "1";
      }
      box.removeAttribute("hidden");
      btn.setAttribute("aria-expanded","true");
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }else{
      box.setAttribute("hidden","");
      btn.setAttribute("aria-expanded","false");
    }
  });
}

/* كرت الحك */
function setupScratch(){
  const msgs = SECRET_DATA.scratch;
  const pick = msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById("scratch-msg").textContent = pick;

  const canvas = document.getElementById("scratch-canvas");
  const ctx = canvas.getContext("2d");
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  ctx.scale(dpr,dpr);
  const grad = ctx.createLinearGradient(0,0,rect.width,rect.height);
  grad.addColorStop(0,"#ff477e"); grad.addColorStop(1,"#2a085c");
  ctx.fillStyle = grad; ctx.fillRect(0,0,rect.width,rect.height);
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.font = "bold 16px 'Segoe UI',Tahoma";
  ctx.textAlign = "center";
  ctx.fillText("احكّيني \uD83D\uDC9D", rect.width/2, rect.height/2+6);
  ctx.globalCompositeOperation = "destination-out";

  let drawing=false, revealed=false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  function scratch(e){
    if(!drawing) return;
    const {x,y} = pos(e);
    ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
    if(!revealed) checkReveal();
  }
  function checkReveal(){
    const img = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let clear=0; for(let i=3;i<img.length;i+=40){ if(img[i]===0) clear++; }
    if(clear/(img.length/40) > .5){
      revealed=true;
      canvas.style.transition="opacity .5s"; canvas.style.opacity="0";
      chime(); if(navigator.vibrate) navigator.vibrate(30);
    }
  }
  const down = e=>{ drawing=true; scratch(e); };
  const up = ()=>{ drawing=false; };
  canvas.addEventListener("mousedown",down);
  canvas.addEventListener("mousemove",scratch);
  window.addEventListener("mouseup",up);
  canvas.addEventListener("touchstart",e=>{e.preventDefault();down(e);},{passive:false});
  canvas.addEventListener("touchmove",e=>{e.preventDefault();scratch(e);},{passive:false});
  canvas.addEventListener("touchend",up);
}

/* انفجار القلوب والورود */
function burst(cx, cy, count){
  const box = document.getElementById("burst");
  const glyphs = ["\u2764\uFE0F","\uD83C\uDF39","\uD83D\uDC9D","\uD83C\uDF38","\uD83D\uDC96","\uD83E\uDD40"];
  if(cx == null) cx = window.innerWidth/2;
  if(cy == null) cy = window.innerHeight/2;
  const n = count || 46;
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.className="particle";
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left = cx+"px"; s.style.top = cy+"px";
    const ang = Math.random()*Math.PI*2, dist = 120+Math.random()*260;
    s.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    s.style.setProperty("--rot", (Math.random()*720-360)+"deg");
    s.style.fontSize = (18+Math.random()*22)+"px";
    s.style.animationDelay = (Math.random()*.25)+"s";
    box.appendChild(s);
    setTimeout(()=>s.remove(), 2200);
  }
}
